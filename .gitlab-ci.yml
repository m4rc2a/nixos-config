stages:
  - check
  - build

variables:
  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: none

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Template for jobs that need internet access (via Arbeitgeber proxy)
.internet-access:
  variables:
    http_proxy: $CODE_PROXY
    https_proxy: $CODE_PROXY
    no_proxy: $CODE_NO_PROXY,$CI_REGISTRY,127.0.0.1,captain.rtf.arbeitgeber.net,.code.arbeitgeber.io,code.arbeitgeber.io
    HTTP_PROXY: $http_proxy
    HTTPS_PROXY: $https_proxy
    NO_PROXY: $no_proxy

# Base Nix configuration
.nix-base:
  timeout: 30min
  image: nixos/nix:2.30.1
  variables:
    NIX_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/nix"
  before_script:
    - nix --version
    - |
      cat > ~/.config/nix/nix.conf << 'NIXCONF'
      experimental-features = nix-command flakes
      substituters = https://cache.nixos.org https://nixos-raspberrypi.cachix.org
      trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      fallback = true
      sandbox = false
      cores = 0
      NIXCONF

# Template for jobs that need to download from Nix caches (internet required)
.nix-with-internet:
  extends:
    - .nix-base
    - .internet-access

# =============================================================================
# Check stage
# =============================================================================

check:flake:
  extends: .nix-base
  stage: check
  cache:
    key: "nix-store-${CI_PROJECT_PATH_SLUG}"
    paths:
      - .cache/nix
    policy: pull
    when: on_success
  script:
    - |
      if [ -d "${NIX_CACHE_DIR}/store" ] && [ "$(ls -A ${NIX_CACHE_DIR}/store 2>/dev/null)" ]; then
        echo "Using cached Nix store..."
        export NIX_CONFIG="${NIX_CONFIG:+$NIX_CONFIG
      }extra-substituters = file://${NIX_CACHE_DIR}/store?trusted=1"
      fi
    - nix flake check --no-build 2>&1 || true
  allow_failure: true

check:format:
  extends: .nix-base
  stage: check
  script:
    - nix fmt -- --check .
  allow_failure: true

# =============================================================================
# Build stage - RPi5 SD image (needs aarch64 runner)
# =============================================================================

build:rpi5-sdimage:
  extends: .nix-with-internet
  stage: build
  tags:
    - DOCKER-AARCH64
  needs: []
  cache:
    key: "nix-store-rpi5-${CI_PROJECT_PATH_SLUG}"
    paths:
      - .cache/nix
    policy: pull-push
    when: on_success
  script:
    - set -euo pipefail

    # Restore cached Nix store paths
    - |
      if [ -d "${NIX_CACHE_DIR}/store" ] && [ "$(ls -A ${NIX_CACHE_DIR}/store 2>/dev/null)" ]; then
        CACHE_SIZE=$(du -sh "${NIX_CACHE_DIR}" 2>/dev/null | cut -f1)
        CACHE_COUNT=$(ls -1 "${NIX_CACHE_DIR}/store" 2>/dev/null | wc -l)
        echo "Restoring Nix cache (${CACHE_SIZE}, ${CACHE_COUNT} paths)..."
        export NIX_CONFIG="${NIX_CONFIG:+$NIX_CONFIG
      }extra-substituters = file://${NIX_CACHE_DIR}/store?trusted=1"
      else
        echo "No cache found, building from scratch..."
      fi

    - nix build .#nixosConfigurations.rpi5-webserver-installer.config.system.build.sdImage --out-link result

    # Update cache with current build dependencies
    - |
      echo "Updating cache with current build dependencies..."
      mkdir -p "${NIX_CACHE_DIR}/new-store"
      nix store copy ./result --to "file://${NIX_CACHE_DIR}/new-store/store" || true
      rm -rf "${NIX_CACHE_DIR}/store"
      mv "${NIX_CACHE_DIR}/new-store/store" "${NIX_CACHE_DIR}/store"
      rmdir "${NIX_CACHE_DIR}/new-store" 2>/dev/null || true

      FINAL_SIZE=$(du -sh "${NIX_CACHE_DIR}" 2>/dev/null | cut -f1)
      FINAL_COUNT=$(ls -1 "${NIX_CACHE_DIR}/store" 2>/dev/null | wc -l)
      echo "Cache updated: ${FINAL_SIZE}, ${FINAL_COUNT} paths"

    # Upload to GitLab Package Registry
    - |
      IMG=$(find -L result -maxdepth 8 -type f -name "*.img.zst" | head -n1)
      BASENAME=$(basename "$IMG")
      PKG_VER="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

      echo "Uploading to GitLab Package Registry..."
      curl --fail --retry 3 --retry-delay 2 \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$IMG" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/nixos-rpi5-sdimage/${PKG_VER}/${BASENAME}"

      echo "GitLab Package URL:"
      echo "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/packages/generic/nixos-rpi5-sdimage/${PKG_VER}/${BASENAME}"

  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    when: on_success
    paths:
      - result/
